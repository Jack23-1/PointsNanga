services:
  postgres:
    image: postgres:16-alpine
    container_name: pointsnanga-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pointsnanga
      POSTGRES_USER: ${POSTGRES_USER:-pointsnanga}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pointsnanga_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pointsnanga} -d pointsnanga"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pointsnanga_postgres_data:
