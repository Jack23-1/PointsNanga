services:
  postgres:
    image: postgres:16-alpine
    container_name: pointsnanga-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pointsnanga
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pointsnanga_postgres_data:/var/lib/postgresql/data

volumes:
  pointsnanga_postgres_data:
